<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Well Test Job Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f6f9;
        }

        h1 {
            color: #003366;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 5px #ccc;
            min-width: 150px;
            text-align: center;
        }

        .card h3 {
            margin: 5px 0;
            font-size: 28px;
            color: #003366;
        }

        .card p {
            margin: 5px 0;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #005a9e;
        }

        .delete-btn {
            background: #d9534f;
        }

        .delete-btn:hover {
            background: #b52b27;
        }

        .load-btn {
            background: #5cb85c;
        }

        .load-btn:hover {
            background: #449d44;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 15px;
        }

        th {
            background: #003366;
            color: white;
            padding: 10px;
            text-align: center;
        }

        td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
        }

        input,
        select {
            width: 100%;
            padding: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        input:focus,
        select:focus {
            border-color: #0078d4;
            outline: none;
        }

        .status-completed {
            background: #dff0d8;
        }

        .status-progress {
            background: #fcf8e3;
        }

        .status-pending {
            background: #f5f5f5;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            display: none;
            border-radius: 5px;
        }

        .success {
            background: #dff0d8;
            color: #3c763d;
        }

        .warning {
            background: #fcf8e3;
            color: #8a6d3b;
        }

        @media (max-width: 900px) {

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 4px;
            }

            .dashboard {
                gap: 10px;
            }

            .card {
                min-width: 120px;
            }
        }

    </style>
</head>


<body>

    <h1>Well Test Job Tracker</h1>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <div class="dashboard">

        <div class="card">
            <h3 id="totalJobs">0</h3>
            <p>Total Jobs</p>
        </div>

        <div class="card">
            <h3 id="completedJobs">0</h3>
            <p>Completed</p>
        </div>

        <div class="card">
            <h3 id="inProgressJobs">0</h3>
            <p>In Progress</p>
        </div>

        <div class="card">
            <h3 id="pendingJobs">0</h3>
            <p>Pending</p>
        </div>

    </div>


    <!-- =========================
         BUTTONS
    ========================== -->

    <button onclick="addRow()">
        + Add Job
    </button>

    <button onclick="saveData()">
        Save Data
    </button>

    <button class="load-btn" onclick="loadData()">
        Load Data
    </button>


    <!-- =========================
         MESSAGE
    ========================== -->

    <div id="message" class="message"></div>


    <!-- =========================
         JOB TABLE
    ========================== -->

    <table id="jobTable">

        <tr>

            <th>Job No</th>
            <th>Client</th>
            <th>Well Name</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Progress %</th>
            <th>Delete</th>

        </tr>


        <!-- DEFAULT JOB -->

        <tr>

            <td>
                <input type="text" value="WT-001">
            </td>

            <td>
                <input type="text" value="SONATRACH">
            </td>

            <td>
                <input type="text" value="MDZ-01">
            </td>

            <td>

                <select>

                    <option>High</option>
                    <option selected>Medium</option>
                    <option>Low</option>

                </select>

            </td>


            <td>

                <select onchange="updateDashboard()">

                    <option>Pending</option>

                    <option selected>
                        In Progress
                    </option>

                    <option>Completed</option>

                </select>

            </td>


            <td>

                <input type="date">

            </td>


            <td>

                <input
                    type="number"
                    value="50"
                    min="0"
                    max="100"
                    onchange="updateDashboard()"
                >

            </td>


            <td>

                <button
                    class="delete-btn"
                    onclick="deleteRow(this)"
                >
                    X
                </button>

            </td>

        </tr>

    </table>



<script>


/* =========================================
   ADD NEW JOB
========================================= */

function addRow() {

    let table =
        document.getElementById("jobTable");

    let row =
        table.insertRow(-1);


    row.innerHTML = `

        <td>
            <input type="text">
        </td>

        <td>
            <input type="text">
        </td>

        <td>
            <input type="text">
        </td>

        <td>

            <select>

                <option>High</option>
                <option>Medium</option>
                <option>Low</option>

            </select>

        </td>

        <td>

            <select onchange="updateDashboard()">

                <option selected>
                    Pending
                </option>

                <option>
                    In Progress
                </option>

                <option>
                    Completed
                </option>

            </select>

        </td>

        <td>

            <input type="date">

        </td>

        <td>

            <input
                type="number"
                value="0"
                min="0"
                max="100"
                onchange="updateDashboard()"
            >

        </td>

        <td>

            <button
                class="delete-btn"
                onclick="deleteRow(this)"
            >
                X
            </button>

        </td>

    `;


    updateDashboard();

}



/* =========================================
   DELETE JOB
========================================= */

function deleteRow(button) {

    let row =
        button.parentNode.parentNode;

    row.remove();

    updateDashboard();

}



/* =========================================
   UPDATE DASHBOARD
========================================= */

function updateDashboard() {

    let rows =
        document.querySelectorAll(
            "#jobTable tr"
        );


    /*
       First row is the header,
       therefore total jobs = rows - 1
    */

    let total =
        rows.length - 1;


    document.getElementById(
        "totalJobs"
    ).innerText = total;


    let completed = 0;

    let inProgress = 0;

    let pending = 0;


    /*
       Find all Status dropdowns.
    */

    let statusSelects =
        document.querySelectorAll(
            '#jobTable tr td:nth-child(5) select'
        );


    statusSelects.forEach(function(select) {


        if (select.value === "Completed") {

            completed++;

        }

        else if (
            select.value === "In Progress"
        ) {

            inProgress++;

        }

        else if (
            select.value === "Pending"
        ) {

            pending++;

        }

    });


    /*
       Update dashboard numbers
    */

    document.getElementById(
        "completedJobs"
    ).innerText = completed;


    document.getElementById(
        "inProgressJobs"
    ).innerText = inProgress;


    document.getElementById(
        "pendingJobs"
    ).innerText = pending;


    /*
       Update row appearance
    */

    updateRowColors();

}



/* =========================================
   UPDATE STATUS COLORS
========================================= */

function updateRowColors() {

    let rows =
        document.querySelectorAll(
            "#jobTable tr"
        );


    rows.forEach(function(row, index) {

        /*
           Ignore header
        */

        if (index === 0) {
            return;
        }


        let status =
            row.querySelector(
                "td:nth-child(5) select"
            );


        if (!status) {
            return;
        }


        /*
           Remove previous classes
        */

        row.classList.remove(
            "status-completed",
            "status-progress",
            "status-pending"
        );


        /*
           Apply new class
        */

        if (status.value === "Completed") {

            row.classList.add(
                "status-completed"
            );

        }

        else if (
            status.value === "In Progress"
        ) {

            row.classList.add(
                "status-progress"
            );

        }

        else {

            row.classList.add(
                "status-pending"
            );

        }

    });

}



/* =========================================
   SAVE DATA
========================================= */

function saveData() {

    let rows =
        document.querySelectorAll(
            "#jobTable tr:not(:first-child)"
        );


    let jobs = [];


    rows.forEach(function(row) {


        let inputs =
            row.querySelectorAll("input");


        let selects =
            row.querySelectorAll("select");


        jobs.push({

            jobNo:
                inputs[0].value,

            client:
                inputs[1].value,

            wellName:
                inputs[2].value,

            priority:
                selects[0].value,

            status:
                selects[1].value,

            dueDate:
                inputs[3].value,

            progress:
                inputs[4].value

        });

    });


    /*
       Store data in browser
    */

    localStorage.setItem(
        "wellTestJobs",
        JSON.stringify(jobs)
    );


    showMessage(
        "Data saved successfully.",
        "success"
    );

}



/* =========================================
   LOAD DATA
========================================= */

function loadData() {

    let savedData =
        localStorage.getItem(
            "wellTestJobs"
        );


    /*
       If no saved data
    */

    if (!savedData) {

        showMessage(
            "No saved data found.",
            "warning"
        );

        return;
    }


    let jobs =
        JSON.parse(savedData);


    let table =
        document.getElementById(
            "jobTable"
        );


    /*
       Remove all existing job rows
    */

    while (
        table.rows.length > 1
    ) {

        table.deleteRow(1);

    }


    /*
       Recreate saved jobs
    */

    jobs.forEach(function(job) {


        let row =
            table.insertRow(-1);


        row.innerHTML = `

            <td>
                <input
                    type="text"
                    value="${escapeHTML(job.jobNo)}"
                >
            </td>

            <td>
                <input
                    type="text"
                    value="${escapeHTML(job.client)}"
                >
            </td>

            <td>
                <input
                    type="text"
                    value="${escapeHTML(job.wellName)}"
                >
            </td>


            <td>

                <select>

                    <option
                        ${job.priority === "High"
                            ? "selected"
                            : ""}
                    >
                        High
                    </option>

                    <option
                        ${job.priority === "Medium"
                            ? "selected"
                            : ""}
                    >
                        Medium
                    </option>

                    <option
                        ${job.priority === "Low"
                            ? "selected"
                            : ""}
                    >
                        Low
                    </option>

                </select>

            </td>


            <td>

                <select
                    onchange="updateDashboard()"
                >

                    <option
                        ${job.status === "Pending"
                            ? "selected"
                            : ""}
                    >
                        Pending
                    </option>

                    <option
                        ${job.status === "In Progress"
                            ? "selected"
                            : ""}
                    >
                        In Progress
                    </option>

                    <option
                        ${job.status === "Completed"
                            ? "selected"
                            : ""}
                    >
                        Completed
                    </option>

                </select>

            </td>


            <td>

                <input
                    type="date"
                    value="${job.dueDate || ""}"
                >

            </td>


            <td>

                <input
                    type="number"
                    value="${job.progress || 0}"
                    min="0"
                    max="100"
                    onchange="updateDashboard()"
                >

            </td>


            <td>

                <button
                    class="delete-btn"
                    onclick="deleteRow(this)"
                >
                    X
                </button>

            </td>

        `;

    });


    updateDashboard();


    showMessage(
        "Data loaded successfully.",
        "success"
    );

}



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    text,
    type
) {

    let message =
        document.getElementById(
            "message"
        );


    message.innerText = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";


    /*
       Hide message after 3 seconds
    */

    setTimeout(function() {

        message.style.display =
            "none";

    }, 3000);

}



/* =========================================
   BASIC HTML ESCAPE
========================================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* =========================================
   INITIALIZE DASHBOARD
========================================= */

updateDashboard();


</script>

</body>

</html>
