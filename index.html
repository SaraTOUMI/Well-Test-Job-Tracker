<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Test Job Tracker</title>
  
<style>
body{
font-family:Arial,sans-serif;
margin:20px;
background:#f4f6f9;
}
  
h1{
color:#003366;
}
  
.dashboard{
display:flex;
gap:20px;
margin-bottom:20px;
}
  
.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 5px #ccc;
min-width:150px;
text-align:center;
}
  
button{
background:#0078d4;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}
  
button:hover {
  background: #005a9e;
}
  
  table{
width:100%;
border-collapse:collapse;
background:white;
  margin-top: 15px;  
}
  
th{
background:#003366;
color:white;
padding:10px;
}
  
td{
border:1px solid #ddd;
padding:5px;
}
  
input,
select{
width:100%;
padding:5px;
box-sizing: border-box;
}
</style>
</head>
  
<body>
  
<h1>Well Test Job Tracker</h1>
  
<div class="dashboard">
    <div class="card">
       <h3 id="totalJobs">1</h3>
       <p>Total Jobs</p>
    </div>
  
 <div class="card">
       <h3 id="completedJobs">0</h3>
       <p>Completed</p>
 </div>
</div>
  
<button onclick="addRow()">+ Add Job</button>
<button onclick="saveData()">Save Data</button>
  
<table id="jobTable">
   <tr>
      <th>Job No</th>
      <th>Client</th>
      <th>Well Name</th>
      <th>Priority</th>
      <th>Status</th>
      <th>Due Date</th>
      <th>Progress %</th>
      <th>Delete</th>
  </tr>
  
  <tr>
      <td><input value="WT-001"></td>
      <td><input value="SONATRACH"></td>
      <td><input value="MDZ-01"></td>
    
      <td>
         <select>
             <option>High</option>
             <option>Medium</option>
             <option>Low</option>
         </select>
     </td>
    
     <td>
        <select onchange="updateDashboard()">
            <option>Pending</option>
            <option selected>In Progress</option>
            <option>Completed</option>
        </select>
     </td>
    
     <td>
        <input type="date">
    </td>
    
    <td>
       <input type="number" value="50">
    </td>
    
    <td>
       <button onclick="deleteRow(this)">X</button>
    </td>
  </tr>
</table>
  
<script>
function addRow(){
  
let table=document.getElementById("jobTable");
  
let row=table.insertRow(-1);
  
row.innerHTML=`
    <td><input></td>
    <td><input></td>
    <td><input></td>
    
<td>
    <select>
       <option>High</option>
       <option>Medium</option>
       <option>Low</option>
    </select>
</td>

<td>
    <select onchange="updateDashboard()">
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
    </select>
</td>

<td>
   <input type="date">
</td>

<td>
<input type="number" value="0">
</td>

<td>
    <button onclick="deleteRow(this)">X</button>
</td>
`;
  
updateDashboard();
}
  
function deleteRow(button){ 
button.parentNode.parentNode.remove();
updateDashboard();
}
  
function updateDashboard(){
  
let rows=document.querySelectorAll("#jobTable tr");
document.getElementById("totalJobs").innerText=rows.length-1;

  let completed=0;
  
let statusSelects = document.querySelectorAll(
'#jobTable tr td:nth-child(5) select'  
if(s.value==="Completed"){
); 
statusSelects.forEach(function(s){
if(s.value === "Completed"){  
completed++;
}
  
});
  
document.getElementById("completedJobs").innerText=completed;
}
  
updateDashboard();
</script>

</body>
</html>
