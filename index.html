<!DOCTYPE html>
<html lang="en">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Well Test Job Tracker</title>
 
<style>
 
body{
font-family:Segoe UI,Arial,sans-serif;
background:#f4f6f9;
margin:20px;
}
 
h1{
color:#003366;
margin-bottom:20px;
}
 
.dashboard{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:20px;
}
 
.card{
background:white;
width:180px;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
text-align:center;
}
 
.card h3{
margin:0;
font-size:32px;
color:#003366;
}
 
.card p{
margin-top:10px;
color:#666;
}
 
.actions{
margin-bottom:20px;
}
 
button{
background:#0078d4;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}
 
button:hover{
background:#005a9e;
}
 
.delete-btn{
background:red;
}
 
.save-btn{
background:green;
}
 
table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
 
th{
background:#003366;
color:white;
padding:12px;
}
 
td{
border:1px solid #ddd;
padding:8px;
}
 
input,select{
width:100%;
padding:6px;
box-sizing:border-box;
}
 
.progress-high{
color:green;
font-weight:bold;
}
 
.progress-medium{
color:orange;
font-weight:bold;
}
 
.progress-low{
color:red;
font-weight:bold;
}
 
</style>
</head>
 
<body>
 
<h1>Well Test Job Tracker</h1>
 
<div class="dashboard">
 
<div class="card">
<h3 id="totalJobs">0</h3>
<p>Total Jobs</p>
</div>
 
<div class="card">
<h3 id="completedJobs">0</h3>
<p>Completed</p>
</div>
 
<div class="card">
<h3 id="pendingJobs">0</h3>
<p>Pending</p>
</div>
 
<div class="card">
<h3 id="progressAvg">0%</h3>
<p>Overall Progress</p>
</div>
 
</div>
 
<div class="actions">
 
<button onclick="addRow()">➕ Add Job</button>
 
<button class="save-btn" onclick="saveData()">💾 Save Data</button>
 
</div>
 
<table id="jobTable">
 
<tr>
<th>Job No</th>
<th>Client</th>
<th>Well Name</th>
<th>Priority</th>
<th>Status</th>
<th>Due Date</th>
<th>Progress %</th>
<th>Delete</th>
</tr>
 
<tr>
 
<td>
<input value="WT-001">
</td>
 
<td>
<input value="SONATRACH">
</td>
 
<td>
<input value="MDZ-01">
</td>
 
<td>
<select>
<option selected>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</td>
 
<td>
<select onchange="updateDashboard()">
<option>Pending</option>
<option selected>In Progress</option>
<option>Completed</option>
</select>
</td>
 
<td>
<input type="date">
</td>
 
<td>
<input type="number" value="50" oninput="updateDashboard()">
</td>
 
<td>
<button class="delete-btn" onclick="deleteRow(this)">X</button>
</td>
 
</tr>
 
</table>
 
<script>
 
let jobCounter = 2;
 
function addRow(){
 
let table = document.getElementById("jobTable");
 
let row = table.insertRow(-1);
 
let jobNo = "WT-" + String(jobCounter).padStart(3,"0");
 
jobCounter++;
 
row.innerHTML = `
 
<td>
<input value="${jobNo}">
</td>
 
<td>
<input>
</td>
 
<td>
<input>
</td>
 
<td>
<select>
<option>High</option>
<option selected>Medium</option>
<option>Low</option>
</select>
</td>
 
<td>
<select onchange="updateDashboard()">
<option selected>Pending</option>
<option>In Progress</option>
<option>Completed</option>
</select>
</td>
 
<td>
<input type="date">
</td>
 
<td>
<input type="number" value="0" oninput="updateDashboard()">
</td>
 
<td>
<button class="delete-btn" onclick="deleteRow(this)">X</button>
</td>
 
`;
 
updateDashboard();
}
 
function deleteRow(button){
 
button.parentElement.parentElement.remove();
 
updateDashboard();
}
 
function updateDashboard(){
 
let rows = document.querySelectorAll("#jobTable tr");
 
document.getElementById("totalJobs").innerText =
rows.length - 1;
 
let completed = 0;
let pending = 0;
let progressTotal = 0;
let progressCount = 0;
 
for(let i=1;i<rows.length;i++){
 
let status =
rows[i].cells[4].querySelector("select").value;
 
let progress =
parseInt(
rows[i].cells[6].querySelector("input").value
) || 0;
 
if(status === "Completed"){
completed++;
}
 
if(status === "Pending"){
pending++;
}
 
progressTotal += progress;
progressCount++;
 
}
 
document.getElementById("completedJobs").innerText =
completed;
 
document.getElementById("pendingJobs").innerText =
pending;
 
let average =
progressCount > 0 ?
Math.round(progressTotal/progressCount) : 0;
 
document.getElementById("progressAvg").innerText =
average + "%";
 
}
 
function saveData(){
 
localStorage.setItem(
"WellTestTracker",
document.getElementById("jobTable").innerHTML
);
 
alert("Data Saved Successfully");
}
 
window.onload = function(){
 
let savedData =
localStorage.getItem("WellTestTracker");
 
if(savedData){
 
document.getElementById("jobTable").innerHTML =
savedData;
 
}
 
updateDashboard();
}
 
updateDashboard();
 
</script>
 
</body>
</html>
